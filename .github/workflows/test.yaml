name: CI

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - '__tests__/**'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.js'
      - '.github/workflows/test.yaml'
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - '__tests__/**'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.js'
      - '.github/workflows/test.yaml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npm run coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/lcov.info

  coveralls:
    needs: test
    if: github.event_name == 'push' && github.repository == 'jcubic/parwik'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: coverage-report
      - uses: coverallsapp/github-action@v2
        with:
          file: lcov.info
